[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false
license = "GPL-3.0-or-later"
repository = "https://github.com/Dev14dbq/tuff"

[workspace.dependencies]
mc-nbt = { path = "crates/mc-nbt" }
mc-protocol = { path = "crates/mc-protocol" }
mc-data = { path = "crates/mc-data" }
mc-world = { path = "crates/mc-world" }
mc-worldgen = { path = "crates/mc-worldgen" }
mc-light = { path = "crates/mc-light" }
mc-entity = { path = "crates/mc-entity" }
mc-tick = { path = "crates/mc-tick" }
mc-storage = { path = "crates/mc-storage" }
mc-features = { path = "crates/mc-features" }
mc-command = { path = "crates/mc-command" }
mc-bootstrap = { path = "crates/mc-bootstrap" }

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
debug = "line-tables-only"

[profile.profiling]
inherits = "release"
debug = true

# RSA key generation in debug builds (tests) is slow without optimised bignums.
[profile.dev.package.num-bigint-dig]
opt-level = 3

# World generation and lighting are too slow unoptimised for tests and
# local runs.
[profile.dev.package.mc-worldgen]
opt-level = 3

[profile.dev.package.mc-light]
opt-level = 3

[profile.dev.package.mc-world]
opt-level = 3

[profile.dev.package.mc-features]
opt-level = 3
