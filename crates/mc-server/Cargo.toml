[package]
name = "mc-server"
description = "Minecraft Java Edition 26.3 compatible server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
mc-nbt.workspace = true
mc-protocol.workspace = true
mc-data.workspace = true
mc-world.workspace = true
mc-worldgen.workspace = true
mc-features.workspace = true
mc-light.workspace = true
mc-entity.workspace = true
mc-tick.workspace = true
mc-storage.workspace = true
tokio = { version = "1.53.3", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync", "signal"] }
anyhow = "1.0.104"
serde_json = "1.0.154"
tracing = "0.1.44"
md-5 = "0.11.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
rsa = { version = "0.9", features = ["getrandom"] }
ureq = "3"
flate2 = "1.1.10"

[lints]
workspace = true

[dev-dependencies]
serde_json = "1.0.154"
