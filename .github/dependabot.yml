# Pull requests that move pinned actions and base images forward. Cargo
# dependencies are checked by cargo deny and cargo audit instead.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      # The compiler version lives in rust-toolchain.toml; the build image
      # moves with it by hand, so new Rust versions are a deliberate step.
      - dependency-name: rust
