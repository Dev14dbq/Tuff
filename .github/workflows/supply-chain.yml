# Dependencies: licenses, known vulnerabilities, banned crates and where
# crates come from. Settings: deny.toml and .cargo/audit.toml.
name: Supply chain

on:
  push:
  pull_request:
  schedule:
    # New advisories appear without any change on our side.
    - cron: "17 4 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install || rustup show
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-deny
      - run: cargo deny --locked check

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install || rustup show
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-audit
      - run: cargo audit
