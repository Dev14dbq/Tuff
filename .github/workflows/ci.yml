name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  clean-room:
    name: Clean-room guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: No Mojang code, jars or decompiler in git
        run: |
          tracked=$(git ls-files -- reference tools cache '*.jar' '*.class')
          if [ -n "$tracked" ]; then
            echo "::error::Proprietary or third-party files are tracked (see README, clean-room):"
            echo "$tracked"
            exit 1
          fi

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install || rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # Compares our sources with decompiled vanilla (reference/ or
      # $MC_REFERENCE). GitHub runners have no reference/, so there it skips;
      # a runner that has it fails on code too close to vanilla.
      - name: Similarity with vanilla (clean-room)
        if: matrix.os == 'ubuntu-latest'
        run: cargo xtask similarity

  fuzz:
    name: Fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo +nightly install cargo-fuzz --locked
      # No extracted game data here, so the packet and command targets only
      # build; NBT and region files run for a minute each.
      - run: cargo +nightly fuzz build
      - run: cargo +nightly fuzz run nbt -- -max_total_time=60
      - run: cargo +nightly fuzz run region -- -max_total_time=60
