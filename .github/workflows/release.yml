# Builds tuff for every supported platform when a version tag (v0.1.0) is
# pushed, and attaches the archives and their SHA-256 checksums to a draft
# GitHub release. The owner reviews the draft and publishes it by hand.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Tag matches Cargo.toml
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match workspace version $version"
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc builds on the oldest supported Ubuntu, so they run on
          # distributions with glibc 2.35 or newer.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          # Static builds with no libc dependency at all.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            musl: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            musl: true
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: |
          rustup toolchain install || rustup show
          rustup target add "$TARGET"
      - name: Install musl tools
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"
      - name: Build
        shell: bash
        run: cargo build --release --locked -p mc-server --target "$TARGET"
      - name: Check the binary runs
        # x86_64 macOS is cross-compiled on an arm64 runner.
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          out=$("target/$TARGET/release/tuff" --version)
          echo "$out"
          case "$out" in "tuff $VERSION "*) ;; *) echo "::error::unexpected version: $out"; exit 1 ;; esac
      - name: Package
        shell: bash
        run: |
          name="tuff-$VERSION-$TARGET"
          mkdir "$name"
          cp LICENSE README.md CHANGELOG.md "$name/"
          if [ "${RUNNER_OS}" = "Windows" ]; then
            cp "target/$TARGET/release/tuff.exe" "$name/"
            7z a -tzip "$name.zip" "$name" > /dev/null
            archive="$name.zip"
            sha256sum "$archive" > "$archive.sha256"
          else
            cp "target/$TARGET/release/tuff" "$name/"
            tar -czf "$name.tar.gz" "$name"
            archive="$name.tar.gz"
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          cat "$archive.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tuff-${{ matrix.target }}
          path: |
            tuff-*.tar.gz
            tuff-*.zip
            tuff-*.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Draft GitHub release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      # Creating a release and uploading its files; nothing else.
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: tuff-*
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          cat ./*.sha256 > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/*.tar.gz dist/*.zip dist/*.sha256 dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --draft --prerelease \
            --title "Tuff $VERSION" \
            --notes-file notes.md \
            --verify-tag
